<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>uid_guard</title>
  <!-- KernelSU 提供的安全区变量（--window-inset-top / -bottom） -->
  <link rel="stylesheet" type="text/css" href="/internal/insets.css" />
  <link rel="stylesheet" type="text/css" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <h1>uid_guard</h1>
      <p id="summary" class="summary">加载中…</p>
    </header>

    <!-- 下拉刷新指示器：跟手下移，松手超过阈值即刷新 -->
    <div id="pull" class="pull" aria-hidden="true">
      <span class="pull-dot"></span>
      <span id="pull-text" class="pull-text">下拉刷新</span>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索应用" autocomplete="off" spellcheck="false" />
    </div>

    <div id="status" class="status" hidden></div>

    <main id="list" class="list" aria-busy="true">
      <div class="placeholder">正在读取应用列表…</div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
