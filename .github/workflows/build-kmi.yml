name: Build KMI Matrix

# 可复用工作流：把一个 GKI 数据文件展开成构建矩阵并逐项构建。
# 由 Build GKI Kernels 调用，不需要手动运行。

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      data_file:
        description: "GKI version data file, e.g. data/android15/6.6.json"
        required: true
        type: string
      deduplicate_sublevels:
        description: "Keep only the first patch level for each kernel sublevel"
        required: false
        type: boolean
        default: true
      build_target:
        description: "Build target: all / android12-5.10 / android12-5.10.272 (with version = that kernel only)"
        required: false
        type: string
        default: "all"

      # ==================== Build configuration ====================
      clean_build:
        required: false
        type: boolean
        default: false
      disable_bakasu:
        required: false
        type: boolean
        default: false
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Feature switches ====================
      use_zram_lz4:
        required: true
        type: boolean
      use_zram_all:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      supp_op:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
        default: "off"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      build_bypass:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      custom_patch_selection:
        description: "Custom patch selection; empty disables custom patches"
        required: false
        type: string
        default: ""
      build_uid_guard:
        description: "Package the uid_guard injector module alongside the kernel"
        required: false
        type: boolean
        default: true
      disable_werror:
        required: false
        type: boolean
        default: false

jobs:
  # 把 build_target 拆成「KMI 名 + 可选内核版本」：
  #   all                  -> kernel_filter 为空（构建该 KMI 全部内核）
  #   android12-5.10       -> kernel_filter 为空
  #   android12-5.10.272   -> kernel_filter = 5.10.272
  #   android12-5.10.X     -> kernel_filter = 5.10.X
  # GitHub 表达式没有字符串分割，所以放在 shell 里做。
  resolve-filter:
    runs-on: ubuntu-latest
    outputs:
      kernel_filter: ${{ steps.parse.outputs.filter }}
    steps:
      - name: 解析 build_target
        id: parse
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail
          BT="${BUILD_TARGET:-all}"
          if [[ "$BT" == "all" ]]; then
            # 全部 KMI，各自完整矩阵
            echo "filter=" >> "$GITHUB_OUTPUT"
          elif [[ "$BT" =~ ^android[0-9]+-([0-9]+\.[0-9]+)$ ]]; then
            # android12-5.10 -> 该 KMI 的全部内核
            echo "filter=" >> "$GITHUB_OUTPUT"
          elif [[ "$BT" =~ ^android[0-9]+-([0-9]+\.[0-9]+\.[0-9]+|[0-9]+\.[0-9]+\.[xX])$ ]]; then
            # android12-5.10.272 -> filter=5.10.272；android12-5.10.X -> filter=5.10.X
            echo "filter=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::build_target 格式无效: $BT"
            echo "  允许的取值: all / android12-5.10 / android12-5.10.272 / android12-5.10.X"
            exit 1
          fi

  prepare-matrix:
    needs: resolve-filter
    uses: ./.github/workflows/prepare-matrix.yml
    with:
      data_file: ${{ inputs.data_file }}
      deduplicate_sublevels: ${{ inputs.deduplicate_sublevels }}
      kernel_filter: ${{ needs.resolve-filter.outputs.kernel_filter }}

  build-kernels:
    needs: prepare-matrix
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs['prepare-matrix'].outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      clean_build: ${{ inputs.clean_build }}
      disable_bakasu: ${{ inputs.disable_bakasu }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision || '' }}
      ksu_variant: ${{ inputs.clean_build && 'Clean' || inputs.disable_bakasu && 'NoKSU' || 'BakaSU' }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram_lz4: ${{ inputs.use_zram_lz4 }}
      use_zram_all: ${{ inputs.use_zram_all }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs && !inputs.disable_bakasu }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      build_bypass: ${{ inputs.build_bypass || false }}
      custom_patch_selection: ${{ inputs.custom_patch_selection || '' }}
      build_uid_guard: ${{ inputs.build_uid_guard }}
      disable_werror: ${{ inputs.disable_werror || false }}
